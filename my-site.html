<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — Pay with EMI Pay</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 440px; margin: 40px auto; padding: 0 16px; color: #0f172a; }
    h1 { font-size: 22px; }
    .product {
      border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin: 12px 0;
    }
    .price { font-size: 20px; font-weight: 800; margin: 6px 0 12px; }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 12px;
      background: #00baf2; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    p { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Demo shop</h1>
  <p>Price yahan fix hai. Buy → EMI Pay checkout (amount create nahi).</p>

  <article class="product">
    <strong>Plan A</strong>
    <div class="price">₹799.00</div>
    <button type="button" data-price="799" data-sku="PLAN-A">Buy Plan A</button>
  </article>
  <article class="product">
    <strong>Plan B</strong>
    <div class="price">₹2,499.00</div>
    <button type="button" data-price="2499" data-sku="PLAN-B">Buy Plan B</button>
  </article>
  <article class="product">
    <strong>Plan C</strong>
    <div class="price">₹12,000.00</div>
    <button type="button" data-price="12000" data-sku="PLAN-C">Buy Plan C</button>
  </article>

  <script src="checkout.js"></script>
  <script>
    document.querySelectorAll("[data-price]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var orderId = btn.getAttribute("data-sku") + "-" + Date.now();
        EmiPay.open({
          amount: btn.getAttribute("data-price"),
          ref: orderId,
        });
      });
    });
  </script>
</body>
</html>
