<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UPI Payment</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=14" />
  <script src="qrcode.min.js"></script>
</head>
<body>
  <main class="wrap">
    <div class="card" id="payCard">
      <header class="hero hero-upi">
        <p class="upi-badge"><img src="logos/upi.svg" alt="" width="36" height="14" /> UPI</p>
        <p class="eyebrow">Pay to</p>
        <h1 id="payeeName">EMI Pay</h1>
        <p class="amount" id="amountDisplay">—</p>
        <p class="ref-line" id="refLine" hidden></p>
      </header>
      <div class="tabs">
        <button type="button" class="tab active" data-tab="upi">Apps</button>
        <button type="button" class="tab" data-tab="qr">QR code</button>
      </div>
      <div class="body" id="panelUpi">
        <p class="hint" id="appHint" hidden></p>
        <a id="chromeOpen" class="btn-ghost block" hidden href="#">Continue in Chrome</a>
        <div class="apps">
          <a id="btnPhonepe" class="app" href="#">
            <span class="logo-wrap pe"><img src="logos/phonepe.svg" alt="" /></span>
            PhonePe
          </a>
          <a id="btnPaytm" class="app" href="#">
            <span class="logo-wrap pt"><img src="logos/paytm.svg" alt="" /></span>
            Paytm
          </a>
        </div>
        <p class="field-label">UPI ID</p>
        <div class="vpa-row">
          <code id="vpaText"></code>
          <button type="button" id="copyVpa" class="btn-mini">Copy</button>
        </div>
      </div>
      <div class="body is-off" id="panelQr">
        <p class="field-label" id="qrNote">Scan with any UPI app</p>
        <div class="qr-wrap"><div id="qr"></div></div>
        <p class="field-label">UPI ID</p>
        <div class="vpa-row">
          <code id="vpaTextQr"></code>
          <button type="button" id="copyVpaQr" class="btn-mini">Copy</button>
        </div>
        <a id="btnOpenUpi" class="btn-primary block" href="#">Pay with UPI</a>
      </div>
    </div>
    <div class="card is-off" id="errCard">
      <div class="body">
        <p class="err">This payment link is missing an amount.</p>
      </div>
    </div>
  </main>
  <script src="config.js?v=14"></script>
  <script src="pay.js?v=14"></script>
</body>
</html>
